name: Deploy Project
on:
    push:
        branches: [dev, main, deploy]
    pull_request:
        branches: [dev, main, deploy]
jobs:
    Test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6

            - name: Set up bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest
            
            - name: Install dependencies
              run: bun install --fronzen-lockfile
            
            - name: Run tests
              run: bun run test
    
    Deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            
            - name: Set up bun
              uses: oven-sh/setup-bun@v2
              with: 
                bun-version: latest
            
            - name: Install dependencies
              run: bun install --frozen-lofile
            
            - name: Deploy
              run: echo "Deploy bun project ...."