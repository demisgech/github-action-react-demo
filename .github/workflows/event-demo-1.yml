name: Event Demo 
on:
    pull_request:
        types: [opened, closed]
        branches: [main, dev, master, "prod*"]
    
    workflow_dispatch:

    push:
        paths-ignore:
            - ".github/workflows/*"
        branches-ignore:
            - "feat/*"

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Output event data
              run: echo "${{ toJson(github.event)}}"
            
            - name: Get Actions
              uses: actions/checkout@v6
            
            - name: Get code
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.14
            
            - name: Install dependencies
              run: bun install --frozen-lockfile
            
            - name: Test code
              run: bun run build
            
            - name: Deploy project
              run: echo "Deploying..."