name: Test The Project
on:
    push:
        branches: [dev, main]

    pull_request:
        branches: [dev, main]
jobs:
    Test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
              
            - name: Set up bun
              uses: oven-sh/setup-bun@v2
              with: 
                bun-version: latest
            
            - name: Install dependencies
              run: bun install --fonzen-lockfile
            
            - name: Run the test
              run: bun run test