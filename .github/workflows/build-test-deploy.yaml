name: Build, Test and Deploy
on: [push, workflow_dispatch]
jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            
            - name: Set up bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.15
            
            - name: Install dependencies
              run: bun install --fronzen-lockfile
    
    Test:
        needs: Build
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            
            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.15
            
            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun run test
    
    Deploy:
        needs: Test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            
            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.15
            
            - name: Install dependencies
              run: bun install --fronzen-lockfile
            
            - name: Deploy
              run: echo "Deploying..."
            
            - name: Done
              run: echo "Project Deployed"